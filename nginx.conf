# ─────────────────────────────────────────────────────────────
# Nginx config for this Django + React project
# Place this file at:  /etc/nginx/sites-available/myapp
# Then run:
#   sudo ln -s /etc/nginx/sites-available/myapp /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace YOUR_SERVER_IP or YOUR_DOMAIN with your actual value.
# Replace /path/to/ABC/Project with the real path on your server.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name YOUR_SERVER_IP;   # e.g. 192.168.1.50  or  example.com

    # ── Hide nginx version from response headers ─────────────
    server_tokens off;

    # ── Security headers (anti-clickjacking + CSP) ───────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self';" always;

    # ── Serve React build (static frontend) ──────────────────
    root /path/to/ABC/Project/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;  # SPA fallback
    }

    # ── Proxy API & admin calls to Gunicorn ──────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django static/media served by Nginx (faster) ─────────
    location /static/ {
        alias /path/to/ABC/Project/backend/staticfiles/;
    }

    location /media/ {
        alias /path/to/ABC/Project/backend/media/;
    }
}
