# Plesk WSGI Configuration File
# Place this in backend/ directory
# Reference: https://docs.plesk.com/en/

[uwsgi]
; Application entry point
wsgi-file = project/wsgi.py
callable = application

; Process and threading
processes = 2
threads = 4
master = true

; Socket configuration
; Plesk will manage this, but ensure it listens locally
socket = 127.0.0.1:8000
listen = 5

; Logging
logto = /var/log/uwsgi/django-abc.log
log-maxsize = 52428800

; Python configuration
python-autoreload = 1
max-requests = 5000

; Virtual environment
virtualenv = /path/to/backend/venv

; Performance
buffer-size = 32768
post-buffering = 8192

; Pidfile
pidfile = /run/uwsgi/django-abc.pid
