services:
  redis:
    image: redis:7-alpine
    container_name: abc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  db:
    image: postgres:16-alpine
    container_name: abc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-abc_sms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abc-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-for-docker-testing
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-abc_sms}
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: 60
      EMAIL_VALIDATION_USE_CELERY: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn project.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    expose:
      - "8000"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abc-celery-worker
    restart: unless-stopped
    environment:
      SECRET_KEY: dev-secret-key-for-docker-testing
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-abc_sms}
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: 60
      EMAIL_VALIDATION_USE_CELERY: "true"
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    command: celery -A project worker -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_USE_SAME_ORIGIN_API: "true"
    container_name: abc-frontend
    restart: unless-stopped
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: abc-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
