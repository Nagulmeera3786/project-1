# Docker Compose for Local Development (Optional for Plesk deployment)
# Useful for testing your app locally before uploading to Plesk
# Usage: docker-compose up

version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: django-abc-postgres
    environment:
      - POSTGRES_DB=abc_sms
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: django-abc-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-for-docker-testing
      - ALLOWED_HOSTS=localhost,127.0.0.1
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/abc_sms
      - DB_CONN_MAX_AGE=60
      - DB_SSLMODE=disable
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8000 --reload
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_USE_SAME_ORIGIN_API: "true"
    container_name: react-abc-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
