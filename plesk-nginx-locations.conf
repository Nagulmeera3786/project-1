# Plesk Nginx Location Blocks for Django + React
# If Plesk is using Nginx, add these location blocks to your domain's Nginx config
# In Plesk: Go to Domain → Nginx Settings and paste relevant sections

# ─────────────────────────────────────────────────────────────
# React SPA Frontend (SPA Routing)
# ─────────────────────────────────────────────────────────────
location / {
    # Try to serve file directly, fallback to index.html
    try_files $uri $uri/ /index.html;
    
    # Optional: Add headers for cache busting
    expires -1;
    add_header Pragma "no-cache";
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
}

# ─────────────────────────────────────────────────────────────
# Django API Endpoints
# ─────────────────────────────────────────────────────────────
location ~ ^/(api|admin)/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Script-Name /api;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffering
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

# ─────────────────────────────────────────────────────────────
# Django Static Files (CSS, JS)
# ─────────────────────────────────────────────────────────────
location /static/ {
    alias /home/your_user/domains/yourdomain.com/backend/staticfiles/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
}

# ─────────────────────────────────────────────────────────────
# Django Media Files (Uploads)
# ─────────────────────────────────────────────────────────────
location /media/ {
    alias /home/your_user/domains/yourdomain.com/backend/media/;
    expires 7d;
    add_header Cache-Control "public";
}

# ─────────────────────────────────────────────────────────────
# Security Headers
# ─────────────────────────────────────────────────────────────
add_header X-Frame-Options "SAMEORIGIN";
add_header X-Content-Type-Options "nosniff";
add_header X-XSS-Protection "1; mode=block";
add_header Referrer-Policy "strict-origin-when-cross-origin";
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";

# ─────────────────────────────────────────────────────────────
# Gzip Compression (usually already enabled in Plesk)
# ─────────────────────────────────────────────────────────────
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript 
            application/json application/javascript application/xml+rss 
            application/rss+xml application/atom+xml image/svg+xml 
            text/x-component text/x-cross-domain-policy;
